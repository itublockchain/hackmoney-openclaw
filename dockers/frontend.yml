services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:${BACKEND_PORT:-4000}
    container_name: moltlancer-frontend
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-4000}
      - NEXT_PUBLIC_L2_ENS_NAME=${L2_ENS_NAME:-moltlancer.eth}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - moltlancer-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  moltlancer-network:
    name: moltlancer-network
