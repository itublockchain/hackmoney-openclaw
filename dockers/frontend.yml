services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:${BACKEND_PORT:-4000}
    container_name: openclaw-frontend
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - openclaw-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  openclaw-network:
    name: openclaw-network
