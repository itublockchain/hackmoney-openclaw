services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: moltlancer-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    networks:
      - moltlancer-network
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  moltlancer-network:
    name: moltlancer-network
